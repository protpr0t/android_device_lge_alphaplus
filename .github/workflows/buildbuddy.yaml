name: Build AlphaDroid ROM (alphaplus)

actions:
  - name: "Build AlphaDroid"
    triggers:
      push:
        branches:
          - main
          - master
          - alphadroid-23.2
      workflow_dispatch: {}

    container_image: "ubuntu:22.04"

    steps:
      - name: "Install System Dependencies & Repo Tool"
        script: |
          apt-get update && apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 x11proto-core-dev libx11-dev libgl1-mesa-dev \
            g++-multilib image-magick libxml2-utils xsltproc unzip python3 \
            python-is-python3 bc libssl-dev libelf-dev rsync git-lfs ccache

          mkdir -p /usr/local/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
          chmod a+rx /usr/local/bin/repo

          git config --global user.name "BuildBuddy Automation"
          git config --global user.email "build@buildbuddy.io"

      - name: "Configure Ccache & Remote BuildBuddy Cache"
        script: |
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="/root/.ccache"
          ccache -M 50G
          ccache -z
          ccache -s

      - name: "Initialize Manifest & Local Manifests"
        script: |
          mkdir -p ~/workspace
          cd ~/workspace
          mkdir -p .repo/local_manifests

          cat << 'EOF' > .repo/local_manifests/alphaplus.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="device/lge/alphaplus" name="protpr0t/android_device_lge_alphaplus" remote="github" revision="alphadroid-23.2" clone-depth="1" />
            <project path="device/lge/sm8150-common" name="protpr0t/android_device_lge_sm8150-common" remote="github" revision="lineage-23.2" clone-depth="1" />
            <project path="hardware/lge" name="LineageOS/android_hardware_lge" remote="github" revision="lineage-23.2" clone-depth="1" />
            <project path="kernel/lge/sm8150" name="rainbowdashh/android_kernel_lge_sm8150" remote="github" revision="lineage-23.2" clone-depth="1" />
            <project path="vendor/lge/alphaplus" name="protpr0t/proprietary_vendor_lge_alphaplus" remote="github" revision="lineage-22.2" clone-depth="1" />
            <project path="vendor/lge/sm8150-common" name="protpr0t/proprietary_vendor_lge_sm8150-common" remote="github" revision="lineage-23.2" clone-depth="1" />
            <project path="hardware/pixelworks/interfaces" name="LineageOS/android_hardware_pixelworks_interfaces" remote="github" revision="lineage-23.2" clone-depth="1" />
          </manifest>
          EOF

          repo init -u https://github.com/AlphaDroid-Project/manifest -b alpha-16.2 --depth=1 --git-lfs --no-clone-bundle

      - name: "Sync Source Tree"
        script: |
          cd ~/workspace
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: "Patch Maintainer Strings & Run Build"
        script: |
          cd ~/workspace
          find device/lge/ -type f -name "*.prop" -exec sed -i '/AlphaDroidMaintainer/d' {} + 2>/dev/null || true
          find vendor/alpha/ -type f -name "*.mk" -exec sed -i '/AlphaDroidMaintainer/d' {} + 2>/dev/null || true

          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="/root/.ccache"
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            export CCACHE_SECONDARY_STORAGE="http://remote.buildbuddy.io:443|bearer_token=${BUILDBUDDY_API_KEY}"
          fi

          source build/envsetup.sh
          breakfast alphaplus
          m installclean
          mka bacon

          ccache -s

      - name: "Upload ROM Zip to Telegram"
        script: |
          OUT_DIR="$HOME/workspace/out/target/product/alphaplus"
          ROM_FILE=$(find "$OUT_DIR" -maxdepth 1 -name "AlphaDroid-*.zip" | head -n 1)

          if [ ! -f "$ROM_FILE" ]; then
            echo "Error: ROM zip file not found in $OUT_DIR"
            exit 1
          fi

          BUILD_DATE=$(date +'%Y-%m-%d %H:%M')
          echo "Uploading $ROM_FILE directly to Telegram..."

          curl -s -F chat_id="${TELEGRAM_CHAT_ID}" \
               -F document=@"${ROM_FILE}" \
               -F caption="AlphaDroid ROM Build for alphaplus ($BUILD_DATE)" \
               "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" > /dev/null
        env:
          TELEGRAM_BOT_TOKEN: "8936959622:AAFrHsU6HTKqSQd8IZFpF2CHpoXMhhOb9iw"
          TELEGRAM_CHAT_ID: "149063451"

