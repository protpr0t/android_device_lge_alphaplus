name: Crave Automated Android ROM Build

on:
  workflow_dispatch:
  push:
    branches: [ "rising-23.2" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Crave CLI
        run: |
          mkdir -p bin
          curl -sL https://raw.githubusercontent.com/accupara/crave/master/crave -o bin/crave || curl -sL https://github.com/accupara/crave/releases/latest/download/crave -o bin/crave
          chmod +x bin/crave
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Setup Crave Configuration
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}
        run: |
          mkdir -p ~/.config/crave/
          cat <<EOF > ~/.config/crave/crave.conf
          {
            "username": "$CRAVE_USERNAME",
            "headers": {
              "Content-Type": "application/json",
              "Authorization": "$CRAVE_TOKEN",
              "User-Agent": "Crave"
            },
            "projects": [],
            "server": "https://foss.crave.io/api"
          }
          EOF

      - name: Execute Build on Crave Devspace
        run: |
          crave run --project "RisingOS" --no-patch -- "
          rm -rf .repo/local_manifests/
          mkdir -p .repo/local_manifests/

          repo init -u https://github.com/RisingOS-Revived/android -b sixteen-qpr2 --depth=1 --git-lfs --no-clone-bundle

          cat << 'EOF' > .repo/local_manifests/alphaplus.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
                  <remote name="rem" fetch="https://github.com" />

                  <project path="hardware/lge" name="rainbowdashh/android_hardware_lge" remote="rem" revision="lineage-23.2" clone-depth="1" />
                  <project path="device/lge/alphaplus" name="protpr0t/android_device_lge_alphaplus" remote="rem" revision="rising-23.2" clone-depth="1" />
                  <project path="device/lge/sm8150-common" name="rainbowdashh/android_device_lge_sm8150-common" remote="rem" revision="lineage-23.2" clone-depth="1" />
                  <project path="vendor/lge/alphaplus" name="lge-qcom-dev/proprietary_vendor_lge_alphaplus" remote="rem" revision="lineage-23.2" clone-depth="1" />
                  <project path="vendor/lge/sm8150-common" name="rainbowdashh/proprietary_vendor_lge_sm8150-common" remote="rem" revision="lineage-23.2" clone-depth="1" />
                  <project path="kernel/lge/sm8150" name="rainbowdashh/android_kernel_lge_sm8150" remote="rem" revision="lineage-23.2" clone-depth="1" />
          </manifest>
          EOF

          /opt/crave/resync.sh

          source build/envsetup.sh
          gk -s
          riseup alphaplus userdebug || lunch lineage_alphaplus-userdebug
          rise b || m bacon
          "

      - name: Pull Build Artifacts
        run: |
          crave pull out/target/product/alphaplus/*.zip

      - name: Upload Build Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: RisingOS-alphaplus
          path: out/target/product/alphaplus/*.zip
          retention-days: 7
